# ===== App info =====
spring.application.name=backend

# ===== MySQL connection =====
spring.datasource.url=jdbc:mysql://localhost:3306/interviewforge_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===== Server =====
server.port=8080

# ===== File uploads (resumes) =====
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ===== CORS: allowed frontend origins, comma-separated =====
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173

# ===== Secrets come from environment variables =====
gemini.api.key=${GEMINI_API_KEY}
gemini.api.base-url=https://generativelanguage.googleapis.com/v1beta

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

# ===== Gemini model (use a model ID your key can access) =====
gemini.model=gemini-3.5-flash-lite
gemini.fallback-model=gemini-3.1-flash-lite

# ===== Interview =====
interview.question-count=5